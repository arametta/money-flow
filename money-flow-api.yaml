openapi: 3.0.3
info:
  title: money-flow API
  description: >
    Contract for the API this app provides. One call fetches the statement for
    an account and month, calculates the monthly summary, sends it to the
    Monthly Summaries API, and returns it. The external APIs this app calls are
    described separately in openapi.yaml.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local run (docker compose up)

tags:
  - name: money-flow API
    description: Builds and sends one monthly summary.

paths:
  /summaries:
    post:
      tags: [money-flow API]
      operationId: createSummary
      summary: Build and send the monthly summary for one account and month
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: month
          in: query
          required: true
          description: Month in YYYY-MM format
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-01'
      responses:
        '200':
          description: Summary calculated and sent. Returns the summary that was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummary'
        '400':
          description: >
            accountId or month is missing or invalid. Messages:
            "accountId is required", "month is required",
            "accountId must not be blank", "month must be in YYYY-MM format".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: month must be in YYYY-MM format
        '404':
          description: The Statements API has no statement for this account and month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: No statement found
        '405':
          description: Any HTTP method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Method not allowed
        '500':
          description: Unexpected error inside this app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Internal error
        '502':
          description: >
            The Statements API or the Monthly Summaries API failed, or the
            Statements API returned an incomplete, empty or mismatched
            statement. Messages: "Statements API failed" (also for missing
            fields), "Statements API returned an incomplete statement" (empty
            response), "Statement does not match the request",
            "Summary API failed".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Statements API failed
        '504':
          description: >
            The Statements API or the Monthly Summaries API did not answer in
            time. Messages: "Statements API timed out", "Summary API timed out".
            After a Summary API timeout the summary may already have been
            stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Statements API timed out

components:
  schemas:
    MonthlySummary:
      type: object
      required:
        - accountId
        - month
        - currency
        - totalIncome
        - totalSpending
        - monthlyBalance
        - openingBalance
        - closingBalance
      properties:
        accountId:
          type: string
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        currency:
          type: string
          example: EUR
        totalIncome:
          type: number
        totalSpending:
          type: number
          description: Always positive.
        monthlyBalance:
          type: number
        openingBalance:
          type: number
        closingBalance:
          type: number

    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Short, safe description of what went wrong.
